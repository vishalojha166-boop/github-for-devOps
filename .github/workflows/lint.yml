# it will check indentataion is correct or not
name: Auto linter

on: 
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
# this step will automatically clone the code of the current brance into the runnner
    steps:
      - name: checkout/clone the code
        uses: actions/checkout@v7
# this step will install the linting toll
      - name: Install linter
        run: pip install ruff
# This step will run the linter
      - name: Check the file for linting background
        run: ruff check .
        
